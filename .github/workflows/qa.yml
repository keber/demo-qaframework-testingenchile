name: qa

# Static checks run on every push / PR. The e2e suite hits the production public
# site, so it runs only on demand and once a week (low, predictable load).
on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1' # Mondays 11:00 UTC

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_DIR: qa/07-automation/e2e

jobs:
  static:
    name: lint + constitution + tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/07-automation/e2e/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install e2e dependencies
        working-directory: ${{ env.E2E_DIR }}
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Constitution scan
        run: npm run check:constitution
      - name: Type-check
        run: npm run typecheck
      - name: Encoding check (forbidden characters)
        run: npm run check:encoding

  e2e:
    name: e2e (chromium)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public URL, not a secret. Override with a repository variable if needed.
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/07-automation/e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: ${{ env.E2E_DIR }}
        run: npm ci
      - name: Install Chromium
        working-directory: ${{ env.E2E_DIR }}
        run: npx playwright install --with-deps chromium
      - name: Run e2e (excludes @destructive)
        working-directory: ${{ env.E2E_DIR }}
        run: npm test
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.E2E_DIR }}/playwright-report
          retention-days: 14
      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: ${{ env.E2E_DIR }}/test-results/results.json
          retention-days: 14
